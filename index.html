<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divya Pooja Store · Pooja Essentials in Minutes</title>
  <meta name="description" content="Order authentic brass & copper pooja items delivered to your door in minutes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div id="site-header"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-card">
        <div class="hero-copy">
          <span class="hero-badge">✨ Festive Special</span>
          <h2>Brass &amp; Copper Pooja Items, Delivered Fast</h2>
          <p>Authentic, temple-grade essentials for your daily rituals &amp; celebrations.</p>
          <a class="hero-cta" href="#categories">Shop Now →</a>
        </div>
        <div class="hero-art">🪔</div>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <div class="container">
    <h3 class="section-label" id="categories">Shop by Category</h3>
    <nav class="categories" id="categoryBar"></nav>
  </div>

  <!-- Catalog -->
  <main class="catalog container">
    <div class="catalog-head">
      <h3 id="catalogTitle">All Products</h3>
      <span id="catalogCount" class="catalog-count"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-emoji">🔍</div>
      <p>No products found. Try another search.</p>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="cart-bar-slot"></div>

  <script src="js/products.js?v=3"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/home.js?v=3"></script>
</body>
</html>
